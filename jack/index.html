<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jack · Fade &amp; Co.</title>
<meta name="description" content="Talk to Jack, the AI receptionist for Fade & Co. Barbers. Live voice call powered by Vapi.">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0b0d10; --panel: #13161b; --line: #232831; --fg: #f3f1ec; --mute: #8b919c;
    --gold: #d8b06a; --gold-2: #f0d39b; --jack: #1b2028; --you: #2a2416; --red: #e5484d; --green: #3fb27f;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .pole { width: 10px; height: 30px; border-radius: 5px; background: repeating-linear-gradient(135deg, var(--gold) 0 6px, var(--fg) 6px 12px, #b54848 12px 18px, var(--fg) 18px 24px); background-size: 100% 34px; animation: pole 2.4s linear infinite; }
  @keyframes pole { to { background-position: 0 34px; } }
  header b { font-size: 15px; letter-spacing: .02em; }
  header small { display: block; color: var(--mute); font-size: 12px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mute); }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); }
  body[data-state="live"] .status i { background: var(--green); box-shadow: 0 0 0 4px rgba(63,178,127,.18); }
  body[data-state="connecting"] .status i { background: var(--gold); animation: blink 1s infinite; }
  body[data-state="error"] .status i { background: var(--red); }
  @keyframes blink { 50% { opacity: .3; } }

  main { flex: 1; display: grid; grid-template-rows: auto 1fr; min-height: 0; max-width: 760px; width: 100%; margin: 0 auto; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 22px 16px 14px; }
  .avatar { position: relative; width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #2b313b, #161a20 70%); border: 1px solid var(--line); font-size: 42px; font-weight: 700; color: var(--gold-2); }
  .avatar::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--gold); opacity: 0; transform: scale(var(--level, 1)); transition: transform .08s linear, opacity .2s; }
  body[data-speaking="jack"] .avatar::before { opacity: .8; }
  body[data-speaking="you"] .avatar { border-color: var(--gold); }
  .who { font-size: 20px; font-weight: 650; }
  .hint { color: var(--mute); font-size: 14px; text-align: center; min-height: 21px; }

  .chat { overflow-y: auto; padding: 8px 16px 18px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 15.5px; animation: in .18s ease-out; }
  .msg.jack { align-self: flex-start; background: var(--jack); border-bottom-left-radius: 5px; }
  .msg.you { align-self: flex-end; background: var(--you); border-bottom-right-radius: 5px; }
  .msg.partial { opacity: .6; }
  .msg small { display: block; font-size: 11px; color: var(--mute); margin-bottom: 2px; text-transform: uppercase; letter-spacing: .06em; }
  .note { align-self: center; font-size: 12.5px; color: var(--gold-2); background: rgba(216,176,106,.08); border: 1px solid rgba(216,176,106,.25); padding: 4px 12px; border-radius: 99px; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }

  footer { display: flex; justify-content: center; gap: 12px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  button { font: 600 15px var(--font); border: 0; border-radius: 99px; padding: 12px 22px; cursor: pointer; color: var(--fg); background: var(--panel); border: 1px solid var(--line); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button.call { background: var(--green); border-color: var(--green); color: #06120c; min-width: 170px; }
  body[data-state="live"] button.call { background: var(--red); border-color: var(--red); color: #fff; }
  body[data-state="connecting"] button.call { background: var(--panel); color: var(--mute); border-color: var(--line); }
  button.mute[aria-pressed="true"] { background: var(--gold); color: #1a1408; border-color: var(--gold); }
  button[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { .pole { animation: none; } .msg { animation: none; } }
</style>
</head>
<body data-state="idle">
<header>
  <span class="pole" aria-hidden="true"></span>
  <div><b>Fade &amp; Co. Barbers</b><small>AI receptionist · Canterbury</small></div>
  <span class="status" role="status" aria-live="polite"><i></i><span id="status">Starting…</span></span>
</header>

<main>
  <section class="stage">
    <div class="avatar" id="avatar" aria-hidden="true">J</div>
    <div class="who">Jack</div>
    <p class="hint" id="hint">Connecting to Jack…</p>
  </section>
  <section class="chat" id="chat" aria-live="polite" aria-label="Conversation"></section>
</main>

<footer>
  <button class="mute" id="mute" type="button" aria-pressed="false" hidden>🎙️ Mute</button>
  <button class="call" id="call" type="button">📞 Call Jack</button>
</footer>

<script type="module">
// Jack - talks to the Vapi assistant "Fade & Co. Barbers receptionist" straight from this page.
// Vapi does the listening, the AI and the voice; bookings go to Google Calendar via the assistant's tools.
// This public key is browser-safe and locked (in Vapi) to this website and to Jack only.
const VAPI_PUBLIC_KEY = "8b9a9bec-e742-4a0e-a929-163aac211771";
const ASSISTANT_ID = "d99524b0-28ce-4c5d-8c18-fa8dcd2c6c20";
const autostart = new URLSearchParams(location.search).get("autostart") !== "0";

const $ = (id) => document.getElementById(id);
const chat = $("chat"), callBtn = $("call"), muteBtn = $("mute");
let vapi = null, state = "idle", partial = { user: null, assistant: null };

const TOOL_NOTES = {
  check_availability: "📅 Checking the diary", book_appointment: "✅ Booking it in", send_confirmation: "✉️ Sending the confirmation",
  find_bookings: "🔎 Looking up your booking", cancel_booking: "🗑️ Cancelling", take_message: "📝 Passing your message on",
};

function setState(s, text, hint) {
  state = s;
  document.body.dataset.state = s;
  $("status").textContent = text;
  if (hint !== undefined) $("hint").textContent = hint;
  callBtn.textContent = s === "live" ? "■ Hang up" : s === "connecting" ? "Connecting…" : "📞 Call Jack";
  callBtn.disabled = s === "connecting";
  muteBtn.hidden = s !== "live";
}
const scroll = () => { chat.scrollTop = chat.scrollHeight; };
function note(text) { const el = document.createElement("div"); el.className = "note"; el.textContent = text; chat.append(el); scroll(); }

function transcript(role, text, final) {
  const who = role === "user" ? "you" : "jack";
  let el = partial[role];
  if (!el) {
    el = document.createElement("div");
    el.className = `msg ${who}`;
    el.innerHTML = `<small>${who === "you" ? "You" : "Jack"}</small><span></span>`;
    chat.append(el);
    partial[role] = el;
  }
  el.querySelector("span").textContent = text;
  el.classList.toggle("partial", !final);
  if (final) partial[role] = null;
  scroll();
}

async function client() {
  if (vapi) return vapi;
  const mod = await import("https://cdn.jsdelivr.net/npm/@vapi-ai/web@2.7.1/+esm");
  const Vapi = mod.default?.default ?? mod.default ?? mod.Vapi;
  vapi = new Vapi(VAPI_PUBLIC_KEY);
  vapi.on("call-start", () => { setState("live", "Live", "Say hi - try booking a haircut."); });
  vapi.on("call-end", () => { setState("idle", "Call ended", "Press Call Jack to talk again."); document.body.dataset.speaking = ""; note("Call ended"); });
  vapi.on("speech-start", () => { document.body.dataset.speaking = "jack"; $("hint").textContent = "Jack is talking…"; });
  vapi.on("speech-end", () => { document.body.dataset.speaking = ""; if (state === "live") $("hint").textContent = "Your turn - Jack is listening."; });
  vapi.on("volume-level", (v) => { $("avatar").style.setProperty("--level", (1 + Math.min(v, 1) * 0.25).toFixed(3)); });
  vapi.on("message", (m) => {
    if (m.type === "transcript") {
      if (m.role === "user") document.body.dataset.speaking = m.transcriptType === "final" ? "" : "you";
      transcript(m.role, m.transcript, m.transcriptType === "final");
    } else if (m.type === "tool-calls") {
      for (const tc of m.toolCallList || m.toolCalls || []) {
        const name = tc.function?.name;
        if (TOOL_NOTES[name]) note(TOOL_NOTES[name] + "…");
      }
    }
  });
  vapi.on("error", (e) => {
    console.error("Vapi error", e);
    const msg = e?.error?.message || e?.errorMsg || e?.message || "";
    setState("error", "Couldn't connect", /permission|NotAllowed|microphone/i.test(String(msg) + JSON.stringify(e?.error || ""))
      ? "Allow the microphone, then press Call Jack." : "Press Call Jack to try again.");
  });
  return vapi;
}

async function start() {
  if (state === "live" || state === "connecting") return;
  setState("connecting", "Connecting…", "Allow the microphone if your browser asks.");
  try {
    const v = await client();
    await v.start(ASSISTANT_ID);
  } catch (e) {
    console.error(e);
    setState("error", "Couldn't connect", "Allow the microphone, then press Call Jack.");
  }
}

callBtn.addEventListener("click", () => (state === "live" ? vapi?.stop() : start()));
muteBtn.addEventListener("click", () => {
  const muted = !vapi?.isMuted?.();
  vapi?.setMuted(muted);
  muteBtn.setAttribute("aria-pressed", String(muted));
  muteBtn.textContent = muted ? "🔇 Unmute" : "🎙️ Mute";
});
addEventListener("beforeunload", () => { try { vapi?.stop(); } catch {} });

// autostart: connect as soon as the app opens. If the browser blocks it without a click, the button is ready.
setState("idle", "Ready", "Press Call Jack to start.");
if (autostart) start();
</script>
</body>
</html>
